name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        working-directory: ${{ runner.temp }}
        run: curl -sfLO https://www.nasm.us/pub/nasm/releasebuilds/3.01/nasm-3.01.tar.xz && echo "b7324cbe86e767b65f26f467ed8b12ad80e124e3ccb89076855c98e43a9eddd4  nasm-3.01.tar.xz" | sha256sum -c - && tar xJf nasm-3.01.tar.xz && cd nasm-3.01 && ./configure -q && make -j"$(nproc)" nasm && sudo install nasm /usr/local/bin/nasm

      - name: Install nasm (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y --no-progress; echo "C:\Program Files\NASM" >> $env:GITHUB_PATH

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-11a

      - name: Print environment
        shell: bash
        run: |
          odin version
          echo "cpus: $(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo unknown)"
          echo "nasm: $(nasm -v 2>/dev/null || echo 'NOT INSTALLED')"

      - name: Run tests
        if: runner.os != 'Windows'
        run: make test-ci

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat test-ci

  vopr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm
        working-directory: ${{ runner.temp }}
        run: curl -sfLO https://www.nasm.us/pub/nasm/releasebuilds/3.01/nasm-3.01.tar.xz && echo "b7324cbe86e767b65f26f467ed8b12ad80e124e3ccb89076855c98e43a9eddd4  nasm-3.01.tar.xz" | sha256sum -c - && tar xJf nasm-3.01.tar.xz && cd nasm-3.01 && ./configure -q && make -j"$(nproc)" nasm && sudo install nasm /usr/local/bin/nasm

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-11a

      - name: VOPR sweep (time-seeded; on failure, replay the printed seed and commit it to VOPR_REGRESSION_SEEDS)
        run: make vopr VOPR_COUNT=500
