name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nasm (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nasm

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-07a

      - name: Print environment
        shell: bash
        run: |
          odin version
          echo "cpus: $(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc 2>/dev/null || echo unknown)"
          echo "nasm: $(nasm -v 2>/dev/null || echo 'NOT INSTALLED')"

      - name: Run tests
        if: runner.os != 'Windows'
        run: make test-ci

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: build.bat test-ci
